  # 屏保组件：独立 .saver 包，由系统 legacyScreenSaver 进程加载。
  # 只读 App 写好的 ~/Library/Application Support/WaifuX/screensaver.json，
  # 不依赖主程序运行（结构参考 MirageWallpaper 的 MirageScreenSaver）。
  WaifuXScreenSaver:
    type: bundle
    platform: macOS
    sources:
      - path: WaifuXScreenSaver
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: WaifuXScreenSaver
        PRODUCT_BUNDLE_IDENTIFIER: com.waifux.app.screensaver
        MARKETING_VERSION: 38.0.153
        CURRENT_PROJECT_VERSION: 38.0.153
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.4"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SRHKTRJ83W
        INFOPLIST_FILE: WaifuXScreenSaver/Info.plist
        WRAPPER_EXTENSION: saver
        SKIP_INSTALL: YES
        # 屏保是插件包：宿主是系统的 legacyScreenSaver，开 Hardened Runtime 只会
        # 让库校验/沙盒行为不可控，这里显式关掉（与 Mirage 的屏保目标一致）。
        ENABLE_HARDENED_RUNTIME: NO
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @loader_path/../Frameworks
