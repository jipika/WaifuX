        MACOSX_DEPLOYMENT_TARGET: "14.4"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SRHKTRJ83W
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: BackgroundAgent/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
