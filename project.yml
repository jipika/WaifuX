name: WaifuX
options:
  bundleIdPrefix: com.waifux
  deploymentTarget:
    macOS: "14.4"
  xcodeVersion: "26.4"

# 共享 Scheme 纳入仓库，避免仅存在 xcuserdata 时换机/重装后 Cmd+R 无可用方案
schemes:
  WaifuX:
    build:
      targets:
        WaifuX: all
        WaifuXHelper: all
        WaifuXWallpaperExtension: all
        WaifuXScreenSaver: all
    run:
      config: Debug
    archive:
      config: Release

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: "2.13.7"
  Kanna:
    url: https://github.com/tid-kijyun/Kanna.git
    from: "5.2.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: "8.8.0"
  Cache:
    url: https://github.com/hyperoslo/Cache.git
    from: "7.4.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    from: "2.6.0"

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SRHKTRJ83W
    REGISTER_APP_GROUPS: YES
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES

targets:
  WaifuX:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Views
      - path: ViewModels
      - path: Models
      - path: Services
      - path: Utilities
      - path: Components
      - path: DesignSystem
      - path: Metal
      - path: Assets.xcassets
      # 含 wallpaper-wgpu（新 Metal 渲染器）、wallpaperengine-cli（旧离线烘焙 renderer）、dxc、dylib 等；assets/ 用于构建时内嵌
      - path: Resources
        type: folder
        buildPhase: resources
        excludes:
          - assets
          - assets/**
          - zip_data.s
          - zip_data.o
          - zip_accessor.c
          - zip_accessor.o
      - path: AnimeRules
        type: folder
        buildPhase: resources
      # 推送到手机工具（PyInstaller 单文件；源码+二进制在 Tools/MobilePush/，git 忽略）
      - path: Tools/MobilePush/we-mpkg-tool
        buildPhase: resources
      - path: Tools/MobilePush/we-pair-server
        buildPhase: resources
      # 根目录源文件（未被以上子目录覆盖）
      - path: WallpaperEngineEmbeddedAssets.swift
      - path: BackgroundAgent/BackgroundAgentWire.swift
      - path: BackgroundAgent/WaifuXHostBundle.swift
      - path: BackgroundAgent/RendererComponentStore.swift
      - path: BackgroundAgent/BackgroundRuntimeRole.swift
      - path: BackgroundAgent/BackgroundRuntimeBridge.swift
      - path: BackgroundAgent/BackgroundAgentClient.swift
      - path: BackgroundAgent/BackgroundAgentRegistration.swift
      - path: BackgroundAgent/BackgroundChildProcessCleanup.swift
      - path: BackgroundAgent/WaifuXPreferences.swift
      - path: BackgroundAgent/com.waifux.app.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    settings:
      base:
        PRODUCT_NAME: WaifuX
        PRODUCT_BUNDLE_IDENTIFIER: com.waifux.app
        MARKETING_VERSION: 38.0.153
        CURRENT_PROJECT_VERSION: 38.0.153
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.4"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: SRHKTRJ83W
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
        # 内嵌 assets zip 的 .o 文件由 scripts/build-wallpaper-wgpu.sh 手动生成并提交。
        OTHER_LDFLAGS: $(inherited)
    dependencies:
      - package: SwiftSoup
      - package: Kanna
      - package: Kingfisher
      - package: Cache
      - package: Sparkle
      - target: WaifuXWallpaperExtension
        embed: true
      - target: WaifuXHelper
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # 屏保组件：拷进 App 资源目录下的固定位置，用户点「安装」时再复制到 ~/Library/Screen Savers。
      # 用 Copy Files 阶段而不是 Run Script：脚本沙箱 deny 了构建产物目录，
      # 脚本里对 .app 内的 rm/mv 会被拒（Operation not permitted）。
      - target: WaifuXScreenSaver
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Resources/Screen Savers
    postBuildScripts:
      - basedOnDependencyAnalysis: false
        script: |
          FRAMEWORKS_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Frameworks"
          APP_RES="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ -d "$FRAMEWORKS_DIR" ]; then
            for framework in "$FRAMEWORKS_DIR"/*.framework; do
              if [ -f "$framework/Info.plist" ]; then
                fw_name=$(basename "$framework" .framework)

                # 整理 framework 标准结构：Versions/Current/Resources + 符号链接
                mkdir -p "$framework/Versions/Current/Resources"
                if [ ! -f "$framework/Versions/Current/Resources/Info.plist" ]; then
                  mv "$framework/Info.plist" "$framework/Versions/Current/Resources/Info.plist"
                  ln -sf "Versions/Current/Resources/Info.plist" "$framework/Info.plist"
                fi
                if [ ! -L "$framework/Resources" ]; then
                  ln -sf "Versions/Current/Resources" "$framework/Resources"
                fi

                # 镜像 SPM 生成本地化资源（zh.lproj 等）到 framework
                SPM_BUNDLE="${BUILT_PRODUCTS_DIR}/${fw_name}_${fw_name}.bundle"
                if [ -d "$SPM_BUNDLE/Contents/Resources" ]; then
                  echo "Mirroring resources from $SPM_BUNDLE to $framework/Versions/Current/Resources"
                  rsync -a "$SPM_BUNDLE/Contents/Resources/" "$framework/Versions/Current/Resources/" 2>/dev/null || \
                    cp -R "$SPM_BUNDLE/Contents/Resources/" "$framework/Versions/Current/Resources/" 2>/dev/null || true
                  PKG_FW="${BUILT_PRODUCTS_DIR}/PackageFrameworks/${fw_name}.framework/Versions/Current/Resources"
                  if [ -d "$PKG_FW" ]; then
                    rsync -a "$SPM_BUNDLE/Contents/Resources/" "$PKG_FW/" 2>/dev/null || true
                  fi
                  rm -rf "$APP_RES/${fw_name}_${fw_name}.bundle" 2>/dev/null || true
                fi

                # 修正 Sparkle CFBundleIdentifier（SPM 生成 spakle.Sparkle → org.sparkle-project.Sparkle）
                FW_PLIST="$framework/Versions/Current/Resources/Info.plist"
                if [ -f "$FW_PLIST" ]; then
                  CURRENT_ID=$(plutil -extract CFBundleIdentifier raw "$FW_PLIST" 2>/dev/null || echo "")
                  if [ "$CURRENT_ID" != "org.sparkle-project.Sparkle" ]; then
                    echo "Rewriting CFBundleIdentifier: $CURRENT_ID -> org.sparkle-project.Sparkle"
                    plutil -replace CFBundleIdentifier -string "org.sparkle-project.Sparkle" "$FW_PLIST"
                  fi
                  PKG_PLIST="${BUILT_PRODUCTS_DIR}/PackageFrameworks/${fw_name}.framework/Versions/Current/Resources/Info.plist"
                  if [ -f "$PKG_PLIST" ]; then
                    PKG_ID=$(plutil -extract CFBundleIdentifier raw "$PKG_PLIST" 2>/dev/null || echo "")
                    if [ "$PKG_ID" != "org.sparkle-project.Sparkle" ]; then
                      plutil -replace CFBundleIdentifier -string "org.sparkle-project.Sparkle" "$PKG_PLIST"
                    fi
                  fi
                fi

                # 整理可执行文件、Headers、Modules 到 Versions/Current
                execName=$(basename "$framework" .framework)
                if [ -f "$framework/$execName" ] && [ ! -L "$framework/$execName" ]; then
                  mv "$framework/$execName" "$framework/Versions/Current/$execName"
                  ln -sf "Versions/Current/$execName" "$framework/$execName"
                fi
                if [ -d "$framework/Headers" ] && [ ! -L "$framework/Headers" ]; then
                  mv "$framework/Headers" "$framework/Versions/Current/Headers"
                  ln -sf "Versions/Current/Headers" "$framework/Headers"
                fi
                if [ -d "$framework/Modules" ] && [ ! -L "$framework/Modules" ]; then
                  mv "$framework/Modules" "$framework/Versions/Current/Modules"
                  ln -sf "Versions/Current/Modules" "$framework/Modules"
                fi
                if [ -d "$framework/_CodeSignature" ]; then
                  rm -rf "$framework/_CodeSignature"
                fi
                find "$framework" -name ".DS_Store" -delete 2>/dev/null || true
              fi
            done
          fi
      - basedOnDependencyAnalysis: false
        script: |
          # 修复旧 wallpaperengine-cli 相关 dylib 的 @@HOMEBREW_ 占位符路径
          CLI_LIB_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/Resources/lib"
          if [[ -d "$CLI_LIB_DIR" ]]; then
            for f in "$CLI_LIB_DIR"/*.dylib; do
              [[ -L "$f" ]] && continue
              [[ ! -f "$f" ]] && continue
              otool -L "$f" 2>/dev/null | tail -n +2 | while IFS= read -r line; do
                dep_path=$(echo "$line" | awk '{print $1}')
                if [[ "$dep_path" == *"@@HOMEBREW_CELLAR@@"* ]] || [[ "$dep_path" == *"@@HOMEBREW_PREFIX@@"* ]]; then
                  dep_base=$(basename "$dep_path")
                  echo "fix-dylib-cli: $(basename "$f") — ${dep_path} -> @loader_path/${dep_base}"
                  install_name_tool -change "$dep_path" "@loader_path/$dep_base" "$f" 2>/dev/null || true
                fi
              done
            done
            for f in "$CLI_LIB_DIR"/*.dylib; do
              [[ -L "$f" ]] && continue
              [[ ! -f "$f" ]] && continue
              codesign --force -s - "$f" 2>/dev/null || true
            done
          fi

          # Resources/assets 已通过 zip_data.o 嵌入 Helper，不能再作为普通资源复制进 .app。
          # Xcode 的 folder reference 会保留整棵 Resources 目录，这里清掉仅用于构建的产物，避免包体重复膨胀。
          BUNDLED_RESOURCES_DIR="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/Resources"
          if [[ -d "$BUNDLED_RESOURCES_DIR" ]]; then
            rm -rf "$BUNDLED_RESOURCES_DIR/assets"
            rm -f "$BUNDLED_RESOURCES_DIR"/zip_data.s \
                  "$BUNDLED_RESOURCES_DIR"/zip_data.o \
                  "$BUNDLED_RESOURCES_DIR"/zip_accessor.c \
                  "$BUNDLED_RESOURCES_DIR"/zip_accessor.o
          fi

          sign_file_if_present() {
            local f="$1"
            if [[ -f "$f" ]]; then
              codesign --force -s - "$f" 2>/dev/null || true
            fi
          }

          sign_wgpu_if_present() {
            local f="$1"
            local entitlements="${SRCROOT}/WallpaperRenderer.entitlements"
            if [[ -f "$f" ]]; then
              if [[ -f "$entitlements" ]]; then
                codesign --force --options runtime --entitlements "$entitlements" -s - "$f" 2>/dev/null || \
                  codesign --force -s - "$f" 2>/dev/null || true
              else
                codesign --force -s - "$f" 2>/dev/null || true
              fi
            fi
          }

          # Xcode folder reference 可能复制为 Contents/Resources/Resources/...；
          # 本地 Run 也要覆盖扁平与嵌套两种布局，避免只有打包脚本签名成功。
          for DXC_BIN in \
            "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/dxc" \
            "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/Resources/dxc"; do
            if [[ -f "$DXC_BIN" ]]; then
              install_name_tool -add_rpath "@loader_path/lib" "$DXC_BIN" 2>/dev/null || true
              install_name_tool -add_rpath "@loader_path/../lib" "$DXC_BIN" 2>/dev/null || true
              sign_file_if_present "$DXC_BIN"
            fi
          done

          for WGPU_BIN in \
            "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/wallpaper-wgpu" \
            "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/Resources/wallpaper-wgpu"; do
            sign_wgpu_if_present "$WGPU_BIN"
          done

          for CLI_BIN in \
            "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/wallpaperengine-cli" \
            "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/Resources/wallpaperengine-cli" \
            "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/wallpaperengine-cli"; do
            sign_file_if_present "$CLI_BIN"
          done

          for DXC_LIB in \
            "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/lib/libdxcompiler.dylib" \
            "${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/Resources/lib/libdxcompiler.dylib"; do
            sign_file_if_present "$DXC_LIB"
          done
      - basedOnDependencyAnalysis: false
        script: |
          # SteamKit2 service is built outside SwiftPM and copied after the
          # folder-reference resources have been staged by Xcode.
          STEAM_SERVICE_DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/WaifuXSteamService"
          "${SRCROOT}/scripts/build-steam-service.sh" "$STEAM_SERVICE_DEST" "${ARCHS:-$(uname -m)}"
          # The .NET host needs the JIT entitlement to survive hardened runtime
          # re-signing in the release pipeline; keep it on the ad-hoc signature.
          find "$STEAM_SERVICE_DEST" -type f -name "dotnet" -print0 2>/dev/null \
            | while IFS= read -r -d '' host; do
                if [[ -f "${SRCROOT}/SteamService.entitlements" ]]; then
                  codesign --force --options runtime --entitlements "${SRCROOT}/SteamService.entitlements" -s - "$host" 2>/dev/null || \
                    codesign --force -s - "$host" 2>/dev/null || true
                fi
              done
          find "$STEAM_SERVICE_DEST" -type f \( -perm -111 -o -name "*.dylib" \) -print0 2>/dev/null \
            | while IFS= read -r -d '' file; do
                codesign --force -s - "$file" 2>/dev/null || true
              done
      - basedOnDependencyAnalysis: false
        name: SignSparkleForDebug
        script: |
          # SPM 的 Sparkle.xcframework 发布时就是 ad-hoc 签名；增量构建时 builtin-copy 拷入
          # adhoc 副本且 CodeSign 判 up-to-date 跳过 → dyld 报 different Team IDs 崩溃。
          # 这里每次构建后强制用当前开发证书重签（Debug 才需要；Release 由 package.sh 统一处理）。
          if [[ "${CONFIGURATION:-}" != "Debug" ]]; then
            exit 0
          fi
          SPARKLE_FRAMEWORK="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Frameworks/Sparkle.framework"
          if [[ ! -d "$SPARKLE_FRAMEWORK" ]]; then
            exit 0
          fi
          IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null \
            | grep "Apple Development" | head -1 | grep -oE "[A-F0-9]{40}")
          if [[ -z "$IDENTITY" ]]; then
            echo "warning: no Apple Development identity; skip Sparkle re-sign"
            exit 0
          fi
          VB="$SPARKLE_FRAMEWORK/Versions/B"
          codesign --force --options runtime -s "$IDENTITY" "$VB/Autoupdate" 2>/dev/null || true
          codesign --force --options runtime -s "$IDENTITY" "$VB/XPCServices/Downloader.xpc" 2>/dev/null || true
          codesign --force --options runtime -s "$IDENTITY" "$VB/XPCServices/Installer.xpc" 2>/dev/null || true
          codesign --force --options runtime -s "$IDENTITY" "$VB/Updater.app" 2>/dev/null || true
          codesign --force --options runtime -s "$IDENTITY" "$VB/Sparkle" 2>/dev/null || true
          codesign --force --options runtime -s "$IDENTITY" "$SPARKLE_FRAMEWORK" 2>/dev/null || true
          echo "Sparkle re-signed with $IDENTITY"
    entitlements:
      path: WaifuX.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.automation.apple-events: true
        com.apple.security.application-groups:
          - group.com.waifux.app

