name: CI

# 本仓库（WaifuX main 线）默认集成分支为 main。
# 若另有 fork/仓库以 feature/wallpaper-engine 为默认分支，应在那个仓库里单独维护 workflow，勿与这里混用。
on:
    # 手动触发：GitHub Actions → CI → Run workflow，选分支即可测试，无需改 VERSION
    workflow_dispatch:
    # 每次推 main 都跑 CI（纯文档/Markdown 变更不触发，见 paths-ignore）；发版逻辑见下方 if
    push:
        branches: [main]
        paths-ignore:
            - "**.md"
            - "docs/**"
    pull_request:
        branches: [main]
        paths-ignore:
            - "**.md"
            - "docs/**"

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    contents: write

jobs:
    build:
        runs-on: xcode-27
        outputs:
            version: ${{ steps.version.outputs.version }}
            publish: ${{ steps.check_tag.outputs.publish }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Select Xcode 27
              run: |
                  sudo xcode-select -s /Applications/Xcode_27.0.0.app/Contents/Developer
                  echo "Xcode Path: $(xcode-select -p)"
                  xcodebuild -version
                  swift --version

            # xcode-27 是预览镜像，可能不自带 Metal 工具链
            # （actions/runner-images#14548 仍 open）。本项目要编译
            # Metal/LiquidGlassClockShaders.metal，缺了会直接构建失败；已装则秒回。
            - name: Ensure Metal Toolchain
              run: sudo xcodebuild -downloadComponent MetalToolchain

            - name: Check XcodeGen
              run: which xcodegen || brew install xcodegen

            - name: Set up .NET 10
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: 10.0.x

            - name: Install create-dmg
              run: brew install create-dmg || true

            - name: Sync VERSION to project.yml
              run: bash scripts/sync-version.sh && grep -E "(MARKETING_VERSION|CURRENT_PROJECT_VERSION)" project.yml

            - name: Generate Xcode Project
              run: |
                xcodegen generate
                python3 scripts/verify-project-configuration.py
                python3 Tests/HelperProvisioningRegression.py
                python3 scripts/test-helper-display-controls.py
                python3 scripts/test-helper-appearance.py
                python3 scripts/test-helper-build-identity.py
                python3 scripts/test-helper-child-cleanup.py
                python3 scripts/test-background-preferences.py
                python3 scripts/test-wallpaper-battery-pause.py
                python3 scripts/test-owned-daemon-identity.py
                python3 scripts/test-helper-network-proxy.py
                python3 scripts/test-background-isolation.py
                python3 scripts/test-wallpaper-extension-lifecycle.py
                python3 scripts/test-native-video-resources.py
                python3 scripts/test-wallpaper-snapshot-work.py

            - name: Cache SPM Dependencies
              uses: actions/cache@v5
              with:
                  path: |
                      ~/Library/Caches/org.swift.swiftpm
                  key: ${{ runner.os }}-spm-${{ hashFiles('**/project.yml') }}
                  restore-keys: |
                      ${{ runner.os }}-spm-

            - name: Check Homebrew cask template
              run: python3 scripts/generate-homebrew-cask.py --check

            - name: Read Version
              id: version
              run: |
                  VERSION=$(cat VERSION | tr -d '[:space:]')
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "tag=v$VERSION" >> $GITHUB_OUTPUT
                  echo "Building version: $VERSION"

            - name: Check if Tag Exists
              id: check_tag
              run: |
                  if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
                    echo "exists=true" >> $GITHUB_OUTPUT
                    echo "publish=false" >> $GITHUB_OUTPUT
                    echo "Tag ${{ steps.version.outputs.tag }} already exists"
                  else
                    echo "exists=false" >> $GITHUB_OUTPUT
                    echo "publish=true" >> $GITHUB_OUTPUT
                    echo "Tag ${{ steps.version.outputs.tag }} does not exist"
                  fi

            # macOS 26: .appex 必须用 xcodebuild 签名，
            # 手动 codesign --entitlements 会静默丢弃 entitlements。
            # 因此在 Build & Package 之前先签好扩展，package.sh 会自动使用预签名的 .appex。
            - name: Setup Certificate & Sign Extension
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_tag.outputs.exists == 'false'
              env:
                  APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
                  APPLE_SIGNING_CERTIFICATE_PWD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PWD }}
                  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
                  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
                  APPLE_APP_PROVISIONING_PROFILE: ${{ secrets.APPLE_APP_PROVISIONING_PROFILE }}
                  APPLE_HELPER_PROVISIONING_PROFILE: ${{ secrets.APPLE_HELPER_PROVISIONING_PROFILE }}
                  APPLE_EXTENSION_PROVISIONING_PROFILE: ${{ secrets.APPLE_EXTENSION_PROVISIONING_PROFILE }}
              run: |
                  # 创建专用 keychain 并导入证书
                  KEYCHAIN_PATH="$RUNNER_TEMP/sign.keychain-db"
                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
                  security default-keychain -s "$KEYCHAIN_PATH"

                  echo "$APPLE_SIGNING_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
                  security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_SIGNING_CERTIFICATE_PWD" -k "$KEYCHAIN_PATH" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
                  security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>/dev/null || true

                  echo "=== 证书列表 ==="
                  security find-identity -v -p codesigning "$KEYCHAIN_PATH"

                  install_profile_from_base64() {
                    local profile_b64="$1"
                    local label="$2"
                    local require_app_group="$3"
                    if [[ -z "$profile_b64" ]]; then
                      return 1
                    fi

                    local profile_path="$RUNNER_TEMP/${label}.provisionprofile"
                    local profile_plist="$RUNNER_TEMP/${label}.plist"
                    mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
                    echo "$profile_b64" | base64 -d > "$profile_path"
                    security cms -D -i "$profile_path" > "$profile_plist"

                    local uuid
                    local name
                    uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")
                    name=$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist")
                    cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.provisionprofile"
                    echo "✅ 安装 provisioning profile: $name ($uuid)"

                    if [[ "$require_app_group" == "1" ]] && ! /usr/libexec/PlistBuddy -c 'Print Entitlements:com.apple.security.application-groups' "$profile_plist" >/dev/null 2>&1; then
                      echo "❌ $label provisioning profile 缺少 application-groups entitlement"
                      exit 1
                    fi

                    if [[ "$label" == "helper" ]]; then
                      local application_id
                      application_id=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:com.apple.application-identifier' "$profile_plist" 2>/dev/null || true)
                      if [[ "$application_id" != *".com.waifux.app.helper" ]]; then
                        echo "❌ Helper profile 的 App ID 不匹配 com.waifux.app.helper"
                        exit 1
                      fi
                      if ! /usr/libexec/PlistBuddy -c 'Print Entitlements:com.apple.security.application-groups' "$profile_plist" | grep -Fq 'group.com.waifux.app'; then
                        echo "❌ Helper profile 缺少 group.com.waifux.app"
                        exit 1
                      fi
                    fi

                    if [[ "$label" == "app" ]]; then
                      echo "WAIFUX_APP_PROVISIONING_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
                      echo "WAIFUX_APP_PROVISIONING_PROFILE_PATH=$profile_path" >> "$GITHUB_ENV"
                    elif [[ "$label" == "helper" ]]; then
                      echo "WAIFUX_HELPER_PROVISIONING_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
                      echo "WAIFUX_HELPER_PROVISIONING_PROFILE_PATH=$profile_path" >> "$GITHUB_ENV"
                    else
                      echo "WAIFUX_EXTENSION_PROVISIONING_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
                      echo "WAIFUX_EXTENSION_PROVISIONING_PROFILE_PATH=$profile_path" >> "$GITHUB_ENV"
                    fi
                    PROFILE_UUID="$uuid"
                  }

                  PROFILE_UUID=""
                  if install_profile_from_base64 "$APPLE_APP_PROVISIONING_PROFILE" "app" "1"; then
                    APP_PROFILE_UUID="$PROFILE_UUID"
                  else
                    APP_PROFILE_UUID=""
                    echo "❌ 未配置 APPLE_APP_PROVISIONING_PROFILE，Developer ID 签名会丢失 App application-groups entitlement"
                    exit 1
                  fi

                  PROFILE_UUID=""
                  if ! install_profile_from_base64 "$APPLE_HELPER_PROVISIONING_PROFILE" "helper" "1"; then
                    echo "❌ 未配置 APPLE_HELPER_PROVISIONING_PROFILE，Helper 无法安全使用共享 App Group"
                    exit 1
                  fi

                  PROFILE_UUID=""
                  if install_profile_from_base64 "$APPLE_EXTENSION_PROVISIONING_PROFILE" "extension" "1"; then
                    EXT_PROFILE_UUID="$PROFILE_UUID"
                  else
                    EXT_PROFILE_UUID=""
                    echo "❌ 未配置 APPLE_EXTENSION_PROVISIONING_PROFILE，Developer ID 签名会丢失扩展 application-groups entitlement"
                    exit 1
                  fi

                  echo "🔨 构建扩展..."
                  EXT_ENTITLEMENTS="WaifuXWallpaperExtension/WaifuXWallpaperExtension.entitlements"
                  EXT_BUILD_LOG="$RUNNER_TEMP/extension-build.log"
                  if [[ -n "$EXT_PROFILE_UUID" ]]; then
                    if ! xcodebuild -project WaifuX.xcodeproj \
                      -target WaifuXWallpaperExtension \
                      -configuration Release \
                      CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
                      DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
                      CODE_SIGN_STYLE=Manual \
                      CODE_SIGN_ENTITLEMENTS="$EXT_ENTITLEMENTS" \
                      PROVISIONING_PROFILE="$EXT_PROFILE_UUID" \
                      ENABLE_HARDENED_RUNTIME=YES \
                      OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
                      clean build > "$EXT_BUILD_LOG" 2>&1; then
                      tail -80 "$EXT_BUILD_LOG"
                      exit 1
                    fi
                  else
                    if ! xcodebuild -project WaifuX.xcodeproj \
                      -target WaifuXWallpaperExtension \
                      -configuration Release \
                      CODE_SIGNING_ALLOWED=NO \
                      clean build > "$EXT_BUILD_LOG" 2>&1; then
                      tail -80 "$EXT_BUILD_LOG"
                      exit 1
                    fi
                  fi
                  tail -30 "$EXT_BUILD_LOG"

                  # 找到签名后的 .appex 并复制到仓库根目录
                  BUILT_APPEX=$(find build ~/Library/Developer/Xcode/DerivedData \
                    \( -path "*/Release/WaifuXWallpaperExtension.appex" -o -path "*/Build/Products/Release/WaifuXWallpaperExtension.appex" \) \
                    -type d -print 2>/dev/null | head -1)
                  if [[ -n "$BUILT_APPEX" && -d "$BUILT_APPEX" ]]; then
                    if [[ -n "$EXT_PROFILE_UUID" ]]; then
                      echo "🔏 使用 provisioning profile entitlements 重签扩展..."
                      EXT_RESIGN_ENTITLEMENTS="$RUNNER_TEMP/extension-resign-entitlements.plist"
                      /usr/libexec/PlistBuddy -x -c 'Print Entitlements' "$RUNNER_TEMP/extension.plist" > "$EXT_RESIGN_ENTITLEMENTS"
                      /usr/libexec/PlistBuddy -c 'Add :com.apple.security.app-sandbox bool true' "$EXT_RESIGN_ENTITLEMENTS" 2>/dev/null || \
                        /usr/libexec/PlistBuddy -c 'Set :com.apple.security.app-sandbox true' "$EXT_RESIGN_ENTITLEMENTS"
                      mkdir -p "$BUILT_APPEX/Contents"
                      cp "$RUNNER_TEMP/extension.provisionprofile" "$BUILT_APPEX/Contents/embedded.provisionprofile"
                      codesign --force --timestamp --options runtime --entitlements "$EXT_RESIGN_ENTITLEMENTS" -s "$APPLE_SIGNING_IDENTITY" "$BUILT_APPEX"
                    else
                      echo "🔏 签名扩展..."
                      codesign --force --timestamp --options runtime --entitlements "$EXT_ENTITLEMENTS" -s "$APPLE_SIGNING_IDENTITY" "$BUILT_APPEX"
                    fi
                    rm -rf ./WaifuXWallpaperExtension.appex
                    cp -R "$BUILT_APPEX" ./WaifuXWallpaperExtension.appex
                    echo "✅ 扩展签名成功"
                    echo "=== 验证 entitlements ==="
                    ENT_CHECK=$(codesign -d --entitlements - ./WaifuXWallpaperExtension.appex 2>/dev/null || true)
                    echo "$ENT_CHECK" | head -20
                    if ! echo "$ENT_CHECK" | grep -q "com.apple.security.application-groups"; then
                      echo "❌ 预签名扩展缺少 application-groups entitlement"
                      echo "请在 GitHub Secrets 配置 APPLE_EXTENSION_PROVISIONING_PROFILE（base64 编码的 Developer ID provisioning profile）"
                      exit 1
                    fi
                  else
                    echo "❌ xcodebuild 未产出 .appex"
                    exit 1
                  fi

            - name: Build & Package
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_tag.outputs.exists == 'false'
              env:
                  WAIFUX_SKIP_DMG: "1"
              run: |
                  chmod +x ./scripts/package.sh
                  # 每次发版固定三个包：
                  #   arm64     —— Apple Silicon 专用（含场景渲染器全家桶）
                  #   x86_64    —— Intel 专用（换装 x86 渲染器组件 + 静态 ffmpeg）
                  #   universal —— 双架构全量包，同时作为旧版客户端升级通道（appcast default item）
                  ARCH_LIST="arm64 x86_64 universal"
                  for ARCH in $ARCH_LIST; do
                    echo "🔨 构建 $ARCH 包..."
                    WAIFUX_ARCH=$ARCH ./scripts/package.sh
                    mv build/WaifuX.app "build/WaifuX-$ARCH.app"
                    lipo -info "build/WaifuX-$ARCH.app/Contents/MacOS/WaifuX"
                  done
                  ls -lh build/

            - name: Sign & Notarize
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_tag.outputs.exists == 'false'
              env:
                  APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
                  APPLE_SIGNING_CERTIFICATE_PWD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PWD }}
                  KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
              run: |
                  # keychain 已在 Sign Extension 步骤中设置，直接使用
                  KEYCHAIN_PATH="$RUNNER_TEMP/sign.keychain-db"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>/dev/null || true

                  # 每次发版固定三个包：
                  #   arm64     —— Apple Silicon 专用（含场景渲染器全家桶）
                  #   x86_64    —— Intel 专用（换装 x86 渲染器组件 + 静态 ffmpeg）
                  #   universal —— 双架构全量包，同时作为旧版客户端升级通道（appcast default item）
                  ARCH_LIST="arm64 x86_64 universal"
                  for ARCH in $ARCH_LIST; do
                  echo "===== Sign & Notarize ($ARCH) ====="
                  rm -rf build/WaifuX.app
                  cp -R "build/WaifuX-$ARCH.app" build/WaifuX.app

                  # 验证证书
                  echo "=== 证书列表 ==="
                  security find-identity -v "$KEYCHAIN_PATH"
                  security find-identity -v -p codesigning "$KEYCHAIN_PATH"
                  echo ""

                  # 先签名 app 内部代码，最后再签 App 本体，避免 --deep 覆盖 renderer 的 JIT entitlement。
                  echo "Signing embedded binaries..."
                  strip_unsupported_slices() {
                    local root="$1"
                    if [[ ! -d "$root" ]] || ! command -v lipo >/dev/null 2>&1; then
                      return 0
                    fi
                    find "$root" -type f | while read -r f; do
                      if file "$f" | grep -q "Mach-O" && lipo -info "$f" 2>/dev/null | grep -q "i386"; then
                        local mode
                        mode="$(stat -f "%Lp" "$f" 2>/dev/null || echo "")"
                        echo "  Removing i386 slice: ${f#build/WaifuX.app/Contents/Resources/}"
                        lipo "$f" -remove i386 -output "$f.tmp"
                        mv "$f.tmp" "$f"
                        if [[ -n "$mode" ]]; then
                          chmod "$mode" "$f" 2>/dev/null || true
                        fi
                      fi
                    done
                  }

                  sign_embedded_code() {
                    local f="$1"
                    # macOS 26: codesign --entitlements 对 .appex 不再生效。
                    # 优先使用仓库中预签名的 .appex（本地 xcodebuild 签名后提交），
                    # 若不存在则尝试 xcodebuild 重新签名。
                    if [[ "$f" == *.appex ]]; then
                      local pre_signed="WaifuXWallpaperExtension.appex"
                      if [[ -d "$pre_signed" ]]; then
                        echo "  Using pre-signed extension: $pre_signed"
                        rm -rf "$f"
                        cp -R "$pre_signed" "$f"
                        echo "  ✅ $(basename "$f") (pre-signed)"
                      else
                        echo "  Signing extension via xcodebuild: $(basename "$f")"
                        local ext_entitlements="WaifuXWallpaperExtension/WaifuXWallpaperExtension.entitlements"
                        local ext_build_log="$RUNNER_TEMP/embedded-extension-build.log"
                        if ! xcodebuild -project WaifuX.xcodeproj \
                          -target WaifuXWallpaperExtension \
                          -configuration Release \
                          CODE_SIGNING_ALLOWED=NO \
                          clean build > "$ext_build_log" 2>&1; then
                          tail -80 "$ext_build_log"
                          exit 1
                        fi
                        tail -20 "$ext_build_log"
                        local built_appex
                        built_appex=$(find build ~/Library/Developer/Xcode/DerivedData \
                          \( -path "*/Release/WaifuXWallpaperExtension.appex" -o -path "*/Build/Products/Release/WaifuXWallpaperExtension.appex" \) \
                          -type d -print 2>/dev/null | head -1)
                        if [[ -n "$built_appex" && -d "$built_appex" ]]; then
                          rm -rf "$f"
                          cp -R "$built_appex" "$f"
                          codesign --force --sign "${{ vars.APPLE_SIGNING_IDENTITY }}" --options=runtime --timestamp --entitlements "$ext_entitlements" "$f"
                          echo "  ✅ $(basename "$f") (xcodebuild signed)"
                        else
                          echo "  ⚠️ xcodebuild did not produce .appex, falling back to codesign"
                          local SIGN_ARGS=(--force --sign "${{ vars.APPLE_SIGNING_IDENTITY }}" --options=runtime --timestamp)
                          if [[ -f "$ext_entitlements" ]]; then
                            SIGN_ARGS+=(--entitlements "$ext_entitlements")
                          fi
                          codesign "${SIGN_ARGS[@]}" "$f"
                        fi
                      fi
                      local ent_check
                      ent_check=$(codesign -d --entitlements - "$f" 2>/dev/null || true)
                      if ! echo "$ent_check" | grep -q "com.apple.security.application-groups"; then
                        echo "  ❌ Extension missing application-groups entitlement: $f"
                        echo "  Debug entitlements:"
                        echo "$ent_check" | head -20
                        exit 1
                      fi
                      return 0
                    fi
                    # 对 framework：先清除旧签名封印，再用 --deep 递归签全部内嵌组件
                    if [[ "$f" == *.framework ]]; then
                      echo "  Signing framework with --deep: $(basename "$f")"

                      # 清除旧签名封印
                      local fw_vers_dir
                      fw_vers_dir="$f"
                      if [[ -d "$f/Versions" ]]; then
                        fw_vers_dir="$f/Versions/$(ls "$f/Versions" 2>/dev/null | grep -v Current | head -1)"
                        [[ -z "$fw_vers_dir" || ! -d "$fw_vers_dir" ]] && fw_vers_dir="$f"
                      fi
                      echo "    Cleaning old code signature in: $(basename "$f")"
                      rm -rf "$fw_vers_dir/_CodeSignature" "$f/_CodeSignature" 2>/dev/null || true

                      # --deep 递归签名 framework 及其内嵌组件
                      codesign --force --deep --sign "${{ vars.APPLE_SIGNING_IDENTITY }}" --options=runtime --timestamp "$f" || {
                        echo "    ❌ --deep failed, falling back to component-wise signing"
                        find "$f" -name "*.xpc" -type d 2>/dev/null | while read -r xpc; do
                          echo "    XPC: ${xpc#"$f/"}"
                          codesign --force --sign "${{ vars.APPLE_SIGNING_IDENTITY }}" --options=runtime --timestamp "$xpc" || exit 1
                        done
                        find "$f" -name "*.app" -type d 2>/dev/null | while read -r app; do
                          echo "    App: ${app#"$f/"}"
                          codesign --force --sign "${{ vars.APPLE_SIGNING_IDENTITY }}" --options=runtime --timestamp "$app" || exit 1
                        done
                        while IFS= read -r -d '' vers_dir; do
                          find "$vers_dir" -maxdepth 1 -type f -print0 2>/dev/null | while IFS= read -r -d '' exe; do
                            if file "$exe" | grep -q "Mach-O"; then
                              echo "    Executable: ${exe#"$f/"}"
                              codesign --force --sign "${{ vars.APPLE_SIGNING_IDENTITY }}" --options=runtime --timestamp "$exe" || exit 1
                            fi
                          done
                        done < <(find "$f/Versions" -mindepth 1 -maxdepth 1 -type d ! -name "Current" ! -type l -print0 2>/dev/null)
                        codesign --force --sign "${{ vars.APPLE_SIGNING_IDENTITY }}" --options=runtime --timestamp "$f"
                      }
                    fi
                    SIGN_ARGS=(--force --sign "${{ vars.APPLE_SIGNING_IDENTITY }}" --options=runtime --timestamp)
                    if [[ "$(basename "$f")" == "wallpaper-wgpu" && -f "WallpaperRenderer.entitlements" ]]; then
                      SIGN_ARGS+=(--entitlements "WallpaperRenderer.entitlements")
                    fi
                    # .NET host（内嵌 SteamKit2 服务）在 hardened runtime 下需要 JIT entitlement
                    if [[ "$(basename "$f")" == "dotnet" && -f "SteamService.entitlements" ]]; then
                      SIGN_ARGS+=(--entitlements "SteamService.entitlements")
                    fi
                    if codesign "${SIGN_ARGS[@]}" "$f" 2>&1; then
                      echo "  ✅ $(basename "$f")"
                    else
                      echo "  ⚠️ Failed to sign: $f"
                    fi
                  }

                  find build/WaifuX.app/Contents/Resources -type f | while read -r f; do
                    if file "$f" | grep -qE "Mach-O|ELF"; then
                      sign_embedded_code "$f"
                    fi
                  done
                  find build/WaifuX.app/Contents/Resources -type d \( -name "*.app" -o -name "*.framework" \) -print 2>/dev/null \
                    | awk '{ print length, $0 }' | sort -rn | cut -d' ' -f2- \
                    | while read -r f; do
                      sign_embedded_code "$f"
                    done
                  if [[ -d build/WaifuX.app/Contents/Frameworks ]]; then
                    find build/WaifuX.app/Contents/Frameworks -maxdepth 1 -type d -name "*.framework" | while read -r f; do
                      sign_embedded_code "$f"
                    done
                  fi

                  # 签名 PlugIns 中的 app extension
                  if [[ -d build/WaifuX.app/Contents/PlugIns ]]; then
                    find build/WaifuX.app/Contents/PlugIns -name "*.appex" | while read -r f; do
                      echo "  Signing extension: $(basename $f)"
                      sign_embedded_code "$f"
                    done
                  fi

                  # 最后签名整个 app bundle
                  echo "Signing app bundle..."
                  if [[ -n "${WAIFUX_APP_PROVISIONING_PROFILE_PATH:-}" && -f "$WAIFUX_APP_PROVISIONING_PROFILE_PATH" ]]; then
                    cp "$WAIFUX_APP_PROVISIONING_PROFILE_PATH" build/WaifuX.app/Contents/embedded.provisionprofile
                  fi
                  codesign --force --options=runtime --timestamp \
                    --entitlements WaifuX.entitlements \
                    --sign "${{ vars.APPLE_SIGNING_IDENTITY }}" build/WaifuX.app
                  APP_ENT_CHECK=$(codesign -d --entitlements - build/WaifuX.app 2>/dev/null || true)
                  if ! echo "$APP_ENT_CHECK" | grep -q "com.apple.security.application-groups"; then
                    echo "  ❌ App missing application-groups entitlement"
                    echo "$APP_ENT_CHECK" | head -20
                    exit 1
                  fi
                  # --strict 对某些第三方 dylib（steamclient.dylib）可能误报，
                  # 但实际功能不受影响，因此不因验证失败而中断构建。
                  codesign --verify --deep --strict --verbose=2 build/WaifuX.app 2>/dev/null || true

                  # 重新打包进 DMG
                  set +e
                  create-dmg \
                    --volname "WaifuX" \
                    --window-size 540 400 \
                    --app-drop-link 400 185 \
                    --hide-extension "WaifuX.app" \
                    --no-internet-enable \
                    build/WaifuX.dmg \
                    build/WaifuX.app
                  CREATE_DMG_STATUS=$?
                  set -e
                  if [ $CREATE_DMG_STATUS -ne 0 ]; then
                    echo "⚠️ create-dmg failed, falling back to hdiutil..."
                    rm -f build/WaifuX.dmg build/rw.*.WaifuX.dmg
                    hdiutil create -volname "WaifuX" \
                      -srcfolder build/WaifuX.app \
                      -ov -format UDZO \
                      -imagekey zlib-level=9 \
                      build/WaifuX.dmg
                  fi

                  # 提交公证
                  echo "Submitting for notarization..."

                  # 预检 secrets：notarytool 会因任一为空而立刻 exit 非零，
                  # 而 set -e + 命令替换会让我们看不到任何输出 —— 在此提前报错
                  if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
                    echo "❌ 公证缺少必要凭证："
                    echo "   APPLE_ID                    : ${APPLE_ID:+SET}${APPLE_ID:-EMPTY}"
                    echo "   APPLE_APP_SPECIFIC_PASSWORD : ${APPLE_APP_SPECIFIC_PASSWORD:+SET}${APPLE_APP_SPECIFIC_PASSWORD:-EMPTY}"
                    echo "   APPLE_TEAM_ID               : ${APPLE_TEAM_ID:+SET}${APPLE_TEAM_ID:-EMPTY}"
                    exit 1
                  fi

                  # 关键：不要用 NOTARY_OUTPUT=$(...) —— set -e 下命令替换里
                  # notarytool 非零会立即终止脚本，看不到任何 stderr。改成先写
                  # 文件、不让该行的非零中断脚本，再 cat 出来后判断 rc。
                  set +e
                  xcrun notarytool submit build/WaifuX.dmg \
                    --apple-id "$APPLE_ID" \
                    --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                    --team-id "$APPLE_TEAM_ID" \
                    --wait > build/notary.log 2>&1
                  NOTARY_RC=$?
                  set -e
                  echo "=== notarytool output (rc=$NOTARY_RC) ==="
                  cat build/notary.log || true
                  echo "=========================================="
                  NOTARY_OUTPUT="$(cat build/notary.log)"

                  # 提取 Submission ID（取第一行匹配）
                  SUBMISSION_ID=$(echo "$NOTARY_OUTPUT" | grep -m1 "id:" | awk '{print $2}' | tr -d '[:space:]')
                  echo "Submission ID: $SUBMISSION_ID"

                  # 检查公证状态（精确匹配 "  status: Accepted" 这一行）
                  STATUS=$(echo "$NOTARY_OUTPUT" | awk '/^  status:/{print $2; exit}' | tr -d '[:space:]')
                  echo "Notarization status: $STATUS"

                  # 如果状态不是 Accepted（或 notarytool 自己就非零退出），打印日志并失败
                  if [ "$NOTARY_RC" -ne 0 ] || [ "$STATUS" != "Accepted" ]; then
                    if [ -n "$SUBMISSION_ID" ]; then
                      echo "=== Notarization Log ==="
                      xcrun notarytool log "$SUBMISSION_ID" \
                        --apple-id "$APPLE_ID" \
                        --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                        --team-id "$APPLE_TEAM_ID" 2>&1 || true
                      echo "========================"
                    fi
                    echo "❌ Notarization failed with rc=$NOTARY_RC status=$STATUS"
                    exit 1
                  fi

                  # 将公证票据 stapled 到 DMG（带重试，CloudKit 同步有时有延迟）
                  for i in {1..5}; do
                    echo "Attempt $i: stapling notarization ticket..."
                    if xcrun stapler staple build/WaifuX.dmg; then
                      echo "✅ 签名+公证完成 ($ARCH)"
                      break
                    fi
                    if [ $i -eq 5 ]; then
                      echo "❌ stapler failed after 5 attempts"
                      exit 1
                    fi
                    sleep 30
                  done

                  if [ "$ARCH" = "universal" ]; then
                    echo "✅ universal DMG 就绪: build/WaifuX.dmg"
                  else
                    mv build/WaifuX.dmg "build/WaifuX-$ARCH.dmg"
                    echo "✅ $ARCH DMG 就绪: build/WaifuX-$ARCH.dmg"
                  fi
                  done

                  ls -lh build/WaifuX*.dmg

            - name: Generate Changelog
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_tag.outputs.exists == 'false'
              id: changelog
              run: |
                  # 获取上一个 tag（用于生成变更日志）
                  PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

                  if [ -n "$PREV_TAG" ]; then
                    # 从上一个 tag 到当前提交的 commit messages 生成日志
                    CHANGELOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges | head -30)
                    echo "Generated changelog from $PREV_TAG to HEAD:"
                    echo "$CHANGELOG"
                  else
                    CHANGELOG="- Initial release"
                    echo "No previous tag found, using default changelog"
                  fi

                  # 写入 GITHUB_OUTPUT 供后续 step 使用
                  {
                    echo "changelog<<EOF"
                    echo "$CHANGELOG"
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            # 构建+签名+公证全部成功后创建 Release 并上传 DMG。
            # softprops/action-gh-release 会自动创建 tag（tag_name）+ Release，
            # 用 GITHUB_TOKEN 即可，无需 PAT，也不依赖 release.yml 被触发。
            - name: Create Release & Upload Asset
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_tag.outputs.exists == 'false'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.version.outputs.tag }}
                  name: WaifuX ${{ steps.version.outputs.version }}
                  body: |
                      ## 更新内容

                      ${{ steps.changelog.outputs.changelog }}

                      ## 版本信息

                      - 版本号: ${{ steps.version.outputs.version }}
                      - Commit: ${{ github.sha }}

                      ## 下载说明（按架构分发）

                      - **Apple Silicon (M 系列)**: 下载 `WaifuX-arm64.dmg`，包含场景壁纸渲染器
                      - **Intel (x86_64)**: 下载 `WaifuX-x86_64.dmg`，暂不包含场景壁纸渲染器（Scene 类型壁纸不可用，静态/视频/Web 壁纸不受影响）
                      - 应用内更新会自动检测当前架构并只推送对应安装包

                      ---

                      ## ☕ 支持开源

                      如果你觉得 WaifuX 对你有帮助，欢迎通过以下方式支持项目的持续发展：

                      - **WaifuX 用户交流群**: [点击加入](https://qm.qq.com/q/SRCj8msygq) 👈 971414910

                      <p align="left">
                        <img src="https://raw.githubusercontent.com/jipika/WaifuX/main/reward.jpg" height="280" alt="微信赞赏码" />
                        &nbsp;&nbsp;&nbsp;&nbsp;
                        <img src="https://raw.githubusercontent.com/jipika/WaifuX/main/afdian_reward.jpg" height="280" alt="爱发电赞助码" />
                      </p>

                      **给项目点个 Star ⭐️** 同样是对开发者最大的鼓励！每一份支持都是我继续维护和迭代这款应用的动力。感谢使用 WaifuX 💜
                  files: build/WaifuX*.dmg
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # 生成带 Sparkle 真实签名的 appcast.xml（拆架构：default / arm64 / x86_64 三个 item），
            # 并上传为本次 release 的资产。
            #
            # 为什么不提交回仓库：main 有分支保护（需 PR + 1 审批，bypass 白名单为空），
            # Actions 的 GITHUB_TOKEN 无法直接 push 回 main。改为：
            #   ① 作为 release 资产上传 —— pages.yml 与后续发版（固化片段）都从这里取；
            #   ② 由 deploy-pages job 直接部署到 GitHub Pages（Sparkle 的 SUFeedURL 指向此处）。
            - name: Generate signed appcast.xml
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_tag.outputs.exists == 'false'
              env:
                  SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
                  CHANGELOG: ${{ steps.changelog.outputs.changelog }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  VERSION="${{ steps.version.outputs.version }}"

                  # Sparkle sign_update：给 DMG 生成 EdDSA 签名
                  curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/2.6.4/Sparkle-2.6.4.tar.xz" -o /tmp/Sparkle.tar.xz
                  (cd /tmp && tar xJf Sparkle.tar.xz)

                  # 固化片段（旧版 universal 客户端的升级通道）：仓库内没有就从历史 release 资产里找。
                  # 片段由 bridge 版生成后随每个 release 持续上传，所以总能命中最早的可用版本；
                  # 不能只看 latest —— 本次 release 已创建，latest 可能正是它自己（还没有该资产）。
                  if [ ! -f Docs/appcast-default-item.xml ]; then
                    echo "仓库内无固化片段，从历史 release 中查找..."
                    FOUND=""
                    while IFS= read -r TAG; do
                      [ -n "$TAG" ] || continue
                      if curl -fsSL "https://github.com/jipika/WaifuX/releases/download/${TAG}/appcast-default-item.xml" -o Docs/appcast-default-item.xml; then
                        FOUND="$TAG"; break
                      fi
                    done < <(gh release list --limit 10 --json tagName --jq '.[].tagName' 2>/dev/null || true)
                    if [ -n "$FOUND" ]; then
                      echo "✅ 固化片段来源: $FOUND"
                    else
                      rm -f Docs/appcast-default-item.xml
                      echo "⚠️ 历史 release 中无固化片段（旧版 universal 客户端本次收不到更新）"
                    fi
                  fi

                  printf '%s\n' "$CHANGELOG" > "$RUNNER_TEMP/changelog.txt"
                  python3 scripts/generate-appcast.py \
                    --version "$VERSION" \
                    --changelog-file "$RUNNER_TEMP/changelog.txt" \
                    --sign-update /tmp/Sparkle/bin/sign_update

                  echo "=== Docs/appcast.xml ==="
                  cat Docs/appcast.xml

                  ASSETS=(Docs/appcast.xml)
                  [ -f Docs/appcast-default-item.xml ] && ASSETS+=(Docs/appcast-default-item.xml)
                  gh release upload "v$VERSION" "${ASSETS[@]}" --clobber
                  echo "✅ appcast 已上传为 release 资产：${ASSETS[*]}"

            # Release 创建后同步更新 homebrew tap 仓库的 Casks/waifux.rb。
            # 跨仓库写入需要 PAT（GITHUB_TOKEN 无权写 homebrew-waifux），
            # 故使用 TAP_REPO_TOKEN。GITHUB_TOKEN 创建的 release 事件不会触发
            # update-homebrew-tap.yml，因此必须在此内联执行。
            - name: Update Homebrew Tap
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_tag.outputs.exists == 'false'
              env:
                  TAP_REPO_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
              run: |
                  VERSION="${{ steps.version.outputs.version }}"

                  # 拆架构分发：两个架构 DMG 都要下载并计算 SHA256
                  download_dmg() {
                    local arch="$1"
                    local url="https://github.com/jipika/WaifuX/releases/download/v${VERSION}/WaifuX-${arch}.dmg"
                    # 等待 Release 资产可下载（刚创建的 Release 偶尔有几秒传播延迟）
                    echo "等待 DMG 可下载: $url"
                    for i in {1..6}; do
                      if curl --fail --silent --show-error --location --retry 2 \
                        --output "/tmp/WaifuX-${arch}.dmg" "$url" && \
                        [ -s "/tmp/WaifuX-${arch}.dmg" ] && \
                        [ "$(wc -c < "/tmp/WaifuX-${arch}.dmg")" -gt 1048576 ]; then
                        echo "✅ WaifuX-${arch}.dmg 下载成功"
                        return 0
                      fi
                      echo "attempt $i: 尚未就绪，10s 后重试..."
                      rm -f "/tmp/WaifuX-${arch}.dmg"
                      sleep 10
                    done
                    echo "❌ WaifuX-${arch}.dmg 下载失败，tap 更新失败"
                    return 1
                  }
                  download_dmg arm64
                  download_dmg x86_64

                  sha256_of() {
                    python3 -c 'import hashlib, sys; h=hashlib.sha256(); f=open(sys.argv[1], "rb"); [h.update(chunk) for chunk in iter(lambda: f.read(1024 * 1024), b"")]; f.close(); print(h.hexdigest())' "$1"
                  }
                  SHA256_ARM=$(sha256_of /tmp/WaifuX-arm64.dmg)
                  SHA256_INTEL=$(sha256_of /tmp/WaifuX-x86_64.dmg)
                  echo "版本: $VERSION  arm64 SHA256: $SHA256_ARM  x86_64 SHA256: $SHA256_INTEL"

                  # 克隆 tap 仓库（用 PAT 认证）
                  git clone --depth 1 "https://x-access-token:${TAP_REPO_TOKEN}@github.com/jipika/homebrew-waifux.git" /tmp/tap
                  cd /tmp/tap

                  # Render the cask from the canonical repository template.
                  python3 "$GITHUB_WORKSPACE/scripts/generate-homebrew-cask.py" \
                    --check
                  python3 "$GITHUB_WORKSPACE/scripts/generate-homebrew-cask.py" \
                    --version "$VERSION" \
                    --sha256-arm "$SHA256_ARM" \
                    --sha256-intel "$SHA256_INTEL" \
                    --output Casks/waifux.rb
                  python3 "$GITHUB_WORKSPACE/scripts/generate-homebrew-cask.py" \
                    --check-file Casks/waifux.rb \
                    --version "$VERSION" \
                    --sha256-arm "$SHA256_ARM" \
                    --sha256-intel "$SHA256_INTEL"
                  ruby -c Casks/waifux.rb

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add Casks/waifux.rb
                  if git diff --cached --quiet; then
                    echo "无变更，跳过"
                  else
                    git commit -m "Bump waifux to v${VERSION}"
                    git push origin HEAD:main
                    echo "✅ homebrew tap 已更新到 v${VERSION}"
                  fi

                  # Validate the exact file present on the remote branch after push.
                  git fetch origin main --depth=1
                  git show FETCH_HEAD:Casks/waifux.rb > /tmp/waifux-cask-pushed.rb
                  cmp -s Casks/waifux.rb /tmp/waifux-cask-pushed.rb
                  python3 "$GITHUB_WORKSPACE/scripts/generate-homebrew-cask.py" \
                    --check-file /tmp/waifux-cask-pushed.rb \
                    --version "$VERSION" \
                    --sha256-arm "$SHA256_ARM" \
                    --sha256-intel "$SHA256_INTEL"
                  ruby -c /tmp/waifux-cask-pushed.rb

            - name: Build (PRs)
              if: github.event_name == 'pull_request'
              run: |
                  mkdir -p build
                  xcodebuild -project WaifuX.xcodeproj \
                    -scheme WaifuX \
                    -destination 'platform=macOS' \
                    -configuration Release \
                    -derivedDataPath build \
                    SWIFT_STRICT_CONCURRENCY=minimal \
                    DEBUG_INFORMATION_FORMAT=dwarf \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGNING_ALLOWED=NO \
                    clean build

            - name: Build (verify push to main, tag exists)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_tag.outputs.exists == 'true'
              run: |
                  mkdir -p build
                  xcodebuild -project WaifuX.xcodeproj \
                    -scheme WaifuX \
                    -destination 'platform=macOS' \
                    -configuration Release \
                    -derivedDataPath build \
                    SWIFT_STRICT_CONCURRENCY=minimal \
                    DEBUG_INFORMATION_FORMAT=dwarf \
                    CODE_SIGNING_REQUIRED=NO \
                    CODE_SIGNING_ALLOWED=NO \
                    clean build

    deploy-pages:
        # 把本次 release 的签名 appcast 部署到 GitHub Pages（Sparkle 的 SUFeedURL 指向此处）。
        # 独立 job 是为了使用 github-pages environment（actions/deploy-pages 的要求）。
        # main 有分支保护（需 PR + 审批），所以 appcast 不提交回仓库，直接从 release 资产取。
        needs: build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: pages
            cancel-in-progress: false
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Use this release's signed appcast
              run: |
                  TAG="v${{ needs.build.outputs.version }}"
                  curl -fsSL "https://github.com/jipika/WaifuX/releases/download/${TAG}/appcast.xml" -o Docs/appcast.xml
                  curl -fsSL "https://github.com/jipika/WaifuX/releases/download/${TAG}/appcast-default-item.xml" \
                    -o Docs/appcast-default-item.xml || true
                  echo "=== 本次部署的 appcast ==="
                  grep -E "sparkle:version|sparkle:channel|edSignature=" Docs/appcast.xml | head -12

            - name: Copy landing page to Docs
              run: |
                  mkdir -p Docs
                  cp landing/index.html Docs/

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: 'Docs'

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
