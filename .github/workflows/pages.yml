name: GitHub Pages

# 与默认分支 main 对齐；文档/落地页变更时部署。
on:
  push:
    branches:
      - main
    paths:
      - 'Docs/**'
      - 'landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Copy landing page to Docs
        run: |
          mkdir -p Docs
          cp landing/index.html Docs/

      # 仓库里的 Docs/appcast.xml 是本地 merge 钩子写的占位版（length=0、无 Sparkle 签名），
      # 直接部署会让 Sparkle 拒绝更新。线上必须使用发版时生成的签名版 —— 它作为 release 资产存在，
      # 优先从最新 release 取；取不到才退回仓库内容（例如尚未发过版）。
      - name: Prefer signed appcast from latest release
        run: |
          if curl -fsSL "https://github.com/jipika/WaifuX/releases/latest/download/appcast.xml" -o Docs/appcast.xml; then
            echo "✅ 使用最新 release 的签名 appcast"
            grep -cE "edSignature=" Docs/appcast.xml | xargs echo "  带签名的 item 数:"
          else
            echo "⚠️ 未取得 release appcast，退回仓库内的占位版本"
          fi
          curl -fsSL "https://github.com/jipika/WaifuX/releases/latest/download/appcast-default-item.xml" \
            -o Docs/appcast-default-item.xml || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 不用 actions/upload-pages-artifact@v3：它内部固定 overwrite:false，
      # 每次 re-run 都再叠一个同名 github-pages artifact，而 deploy-pages 要求
      # 全 run（含所有 attempt）恰好一个 → 首次失败后重跑必报 "Multiple artifacts"。
      # 这里自己打 tar（与其内部格式一致）再用 upload-artifact@v4 overwrite:true，
      # 重跑时覆盖同名 artifact，永远只留一个。
      - name: Archive Pages artifact
        run: |
          tar --dereference --hard-dereference \
            --directory Docs \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      # deploy-pages 上传后立刻查 ListArtifacts，本仓库常命中可见性延迟返回
      # Found 0（上传成功 0.x 秒后就查）而直接失败。这里先轮询 REST 直到恰好
      # 一个 github-pages artifact 可见再部署，消除该竞态；配合上面的 overwrite
      # 保证数量恒为 1，不会误撞 "Multiple artifacts"。
      - name: Wait for artifact to be listable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
                  --jq '[.artifacts[] | select(.name=="github-pages")] | length')
            echo "attempt $i: github-pages artifact count = $n"
            if [ "$n" = "1" ]; then
              echo "✅ artifact 已可见，开始部署"
              exit 0
            fi
            sleep 5
          done
          echo "❌ 等待 150s 后 github-pages artifact 仍非唯一（count=$n）"
          exit 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4